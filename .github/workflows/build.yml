name: Build

# One branch per Minecraft version (NeoFabric/1.21.1, NeoFabric/26.3...), each
# building every loader it has. This file reads the versions from
# gradle.properties, so it is the same on every branch.
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "testpack/**"
      - "tools/**"
  pull_request:
  # Run by hand (Actions > Build > Run workflow) to publish what is already
  # pushed: an empty [curseforge] commit changes no files, so paths-ignore
  # skips it and nothing runs.
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Publish to CurseForge as"
        type: choice
        options: [none, release, beta, alpha]
        default: none
      modrinth:
        description: "Publish to Modrinth as"
        type: choice
        options: [none, release, beta, alpha]
        default: none

permissions:
  contents: read

# Actions are pinned by commit SHA, with the version in a comment: a tag can be
# moved to other code by whoever controls the action's repository, a commit
# cannot. Dependabot updates both together.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_id: ${{ steps.gradle_props.outputs.mod_id }}
      mod_name: ${{ steps.gradle_props.outputs.mod_name }}
      mod_version: ${{ steps.gradle_props.outputs.mod_version }}
      minecraft_version: ${{ steps.gradle_props.outputs.minecraft_version }}
      java_version: ${{ steps.gradle_props.outputs.java_version }}
      loaders: ${{ steps.loaders.outputs.loaders }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read mod properties
        id: gradle_props
        run: |
          set -euo pipefail
          for key in mod_id mod_version minecraft_version java_version; do
            value=$(grep -E "^$key=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            [ -n "$value" ] || { echo "$key not found in gradle.properties"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          # Spaces kept: it is a display name.
          mod_name=$(grep -E "^mod_name=" gradle.properties | head -n1 | cut -d= -f2- | sed 's/[[:space:]]*$//')
          echo "mod_name=$mod_name" >> "$GITHUB_OUTPUT"
          # The Java Gradle itself runs on, which can be newer than the one
          # the mod is compiled for (Loom 1.19+ needs 25).
          daemon=$(grep -E "^toolchainVersion=" gradle/gradle-daemon-jvm.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "daemon_java_version=${daemon:-$(grep -E '^java_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')}" >> "$GITHUB_OUTPUT"

      # Both JDKs: the one the mod is compiled for (java_version) and the one
      # Gradle runs on. The last one listed becomes JAVA_HOME, so gradlew
      # starts on the daemon's; the Build step points Gradle at the other.
      # Without them, foojay downloads the right one mid-build: it works, but
      # it re-downloads every run and turns an outage in someone else's
      # service into a failed build.
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: |
            ${{ steps.gradle_props.outputs.java_version }}
            ${{ steps.gradle_props.outputs.daemon_java_version }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # The loaders this branch builds are the loader modules it has, so a
      # Fabric-only branch needs no edit here.
      - name: Detect loaders
        id: loaders
        run: |
          set -euo pipefail
          loaders=()
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] && loaders+=("\"$loader\"")
          done
          [ ${#loaders[@]} -gt 0 ] || { echo "No loader module found"; exit 1; }
          echo "loaders=[$(IFS=,; echo "${loaders[*]}")]" >> "$GITHUB_OUTPUT"

      # setup-java leaves each JDK in JAVA_HOME_<version>_X64, where Gradle
      # does not look for toolchains on its own.
      - name: Build
        env:
          JAVA: ${{ steps.gradle_props.outputs.java_version }}
        run: ./gradlew build "-Porg.gradle.java.installations.fromEnv=JAVA_HOME_${JAVA}_X64"

      # Named exactly: a glob would also pick up the sources and javadoc jars.
      - name: Collect jars
        env:
          MOD_ID: ${{ steps.gradle_props.outputs.mod_id }}
          MOD_VERSION: ${{ steps.gradle_props.outputs.mod_version }}
          MC: ${{ steps.gradle_props.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for loader in fabric neoforge; do
            [ -f "$loader/build.gradle" ] || continue
            cp "$loader/build/libs/$MOD_ID-$loader-$MOD_VERSION+mc$MC.jar" dist/
          done
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars
          path: dist/*.jar
          retention-days: 14
          if-no-files-found: error

  # Publishes the jars to CurseForge only when the pushed commit message
  # contains [curseforge], optionally with a release type ([curseforge beta],
  # [curseforge alpha]), or when the workflow is run by hand with a release
  # type other than none. One upload per loader. The changelog is the English
  # part of changelogs/changelog-<version>.md or, without it, the body of the
  # commit message. Needs the CURSEFORGE_TOKEN secret and the
  # CURSEFORGE_PROJECT_ID variable. Its own job, so only it gets write access.
  publish-curseforge:
    needs: build
    if: >-
      ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[curseforge'))
      || (github.event_name == 'workflow_dispatch' && inputs.curseforge != 'none') }}
    runs-on: ubuntu-latest
    # One publish per branch and loader at a time: a push and a manual run
    # together would both pass the tag check before either pushed its tag.
    # Queued, never cancelled: an upload cut midway is worse than a second one
    # that finds the tag and stops.
    concurrency:
      group: curseforge-${{ github.ref }}-${{ matrix.loader }}
      cancel-in-progress: false
    permissions:
      contents: write # needed to push the curseforge-* tags
    strategy:
      # Each loader uploads on its own: one failing must not cancel the other,
      # and a re-run then only uploads what is missing (see the tag check).
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.build.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: dist

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          # The environments the mod runs in, as CurseForge names them. A
          # client-only mod lists Client alone.
          CURSEFORGE_SIDES: "Client,Server"
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_TYPE: ${{ inputs.curseforge }}
          MOD_ID: ${{ needs.build.outputs.mod_id }}
          MOD_NAME: ${{ needs.build.outputs.mod_name }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC: ${{ needs.build.outputs.minecraft_version }}
          JAVA: ${{ needs.build.outputs.java_version }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"

          # Each file states its own relations, so a loader never lists a mod
          # that does not exist for it. Slug plus project ID, which the Upload
          # API takes for an exact match; the ID is a JSON number (as a string
          # the API rejects the whole upload). Types: requiredDependency,
          # optionalDependency, embeddedLibrary, tool, incompatible.
          FABRIC_API='{"slug": "fabric-api", "projectID": 306612, "type": "requiredDependency"}'
          # Optional integrations: 3D armor, recipe viewer, backpack slots.
          GECKOLIB='{"slug": "geckolib", "projectID": 388172, "type": "optionalDependency"}'
          JEI='{"slug": "jei", "projectID": 238222, "type": "optionalDependency"}'
          CURIOS='{"slug": "curios", "projectID": 309927, "type": "optionalDependency"}'
          TRINKETS='{"slug": "trinkets", "projectID": 341284, "type": "optionalDependency"}'
          case "$LOADER" in
            fabric)   LOADER_NAME=Fabric;   RELATIONS="[$FABRIC_API, $GECKOLIB, $JEI, $TRINKETS]" ;;
            neoforge) LOADER_NAME=NeoForge; RELATIONS="[$GECKOLIB, $JEI, $CURIOS]" ;;
            *) echo "Unknown loader $LOADER"; exit 1 ;;
          esac

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi
          if [[ "$DISPATCH_TYPE" =~ ^(alpha|beta|release)$ ]]; then RELEASE_TYPE="$DISPATCH_TYPE"; fi

          # The English part of changelogs/changelog-<version>.md (from the
          # first "## " heading up to a "---" or <details> line), else the
          # commit message without its first line and the markers, else a
          # plain line.
          CHANGELOG=""
          file="changelogs/changelog-$MOD_VERSION.md"
          if [ -f "$file" ]; then
            CHANGELOG=$(awk '/^---[[:space:]]*$/ || /^<details>/{ exit } /^## /{ found=1 } found' "$file")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed -E 's/\[(curseforge|modrinth)[^]]*\]//g' | sed '/./,$!d')
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="$MOD_NAME $MOD_VERSION for $LOADER_NAME $MC."

          # A version already on CurseForge (marked with a tag, see the upload
          # below) is not uploaded again. The loader is part of the tag, so
          # each loader's file is tracked on its own.
          tag="curseforge-$LOADER-$MC-$MOD_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$LOADER_NAME $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar="dist/$MOD_ID-$LOADER-$MOD_VERSION+mc$MC.jar"
          # "Custom Gear 1.0.0 for NeoForge 1.21.1": the loader and Minecraft
          # version keep every name unique across branches, which upload the
          # same mod version each for its own Minecraft version.
          name="$MOD_NAME $MOD_VERSION for $LOADER_NAME $MC"

          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "$name" \
            --arg mc "$MC" \
            --arg loader "$LOADER_NAME" \
            --arg java "Java $JAVA" \
            --arg sides "$CURSEFORGE_SIDES" \
            --argjson relations "$RELATIONS" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: ([$mc, $java, $loader] + ($sides | split(","))),
              relations: {projects: $relations}}')

          # The tag goes up BEFORE the upload and comes back down if the upload
          # fails. The other way round, an upload whose tag then failed to push
          # got uploaded a second time by the next run, and a duplicate on
          # CurseForge can only be removed by hand.
          git tag "$tag"
          git push origin "$tag"

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for $LOADER_NAME $MC"
          if ! curl -sS --fail-with-body -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            --form-string "metadata=$metadata" -F "file=@$jar"; then
            echo
            echo "::error::The upload to CurseForge failed; removing tag $tag so a new run uploads it."
            git push --delete origin "$tag" \
              || echo "::error::Could not delete tag $tag: delete it by hand before running again."
            exit 1
          fi
          echo

  # Same as publish-curseforge, for Modrinth: [modrinth], [modrinth beta] or
  # [modrinth alpha] in the commit message, or a manual run. Needs the
  # MODRINTH_TOKEN secret (a personal access token with the "Create versions"
  # scope) and the MODRINTH_PROJECT_ID variable (the project's ID or slug).
  publish-modrinth:
    needs: build
    if: >-
      ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[modrinth'))
      || (github.event_name == 'workflow_dispatch' && inputs.modrinth != 'none') }}
    runs-on: ubuntu-latest
    concurrency:
      group: modrinth-${{ github.ref }}-${{ matrix.loader }}
      cancel-in-progress: false
    permissions:
      contents: write # needed to push the modrinth-* tags
    strategy:
      fail-fast: false
      matrix:
        loader: ${{ fromJSON(needs.build.outputs.loaders) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars
          path: dist

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          USER_AGENT: ${{ github.repository }} (GitHub Actions)
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_TYPE: ${{ inputs.modrinth }}
          MOD_ID: ${{ needs.build.outputs.mod_id }}
          MOD_NAME: ${{ needs.build.outputs.mod_name }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC: ${{ needs.build.outputs.minecraft_version }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          : "${MODRINTH_TOKEN:?Add the MODRINTH_TOKEN secret to the repository}"
          : "${MODRINTH_PROJECT_ID:?Add the MODRINTH_PROJECT_ID variable to the repository}"

          # Each version states its own dependencies. project_id is the
          # project's ID (not its slug); dependency_type is required,
          # optional, incompatible or embedded. P7dR8mSH is Fabric API.
          FABRIC_API='{"project_id": "P7dR8mSH", "dependency_type": "required"}'
          GECKOLIB='{"project_id": "8BmcQJ2H", "dependency_type": "optional"}'
          JEI='{"project_id": "u6dRKJwZ", "dependency_type": "optional"}'
          CURIOS='{"project_id": "vvuO3ImH", "dependency_type": "optional"}'
          TRINKETS='{"project_id": "5aaWibi9", "dependency_type": "optional"}'
          case "$LOADER" in
            fabric)   LOADER_NAME=Fabric;   DEPENDENCIES="[$FABRIC_API, $GECKOLIB, $JEI, $TRINKETS]" ;;
            neoforge) LOADER_NAME=NeoForge; DEPENDENCIES="[$GECKOLIB, $JEI, $CURIOS]" ;;
            *) echo "Unknown loader $LOADER"; exit 1 ;;
          esac

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[modrinth\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi
          if [[ "$DISPATCH_TYPE" =~ ^(alpha|beta|release)$ ]]; then RELEASE_TYPE="$DISPATCH_TYPE"; fi

          # Same changelog rules as publish-curseforge.
          CHANGELOG=""
          file="changelogs/changelog-$MOD_VERSION.md"
          if [ -f "$file" ]; then
            CHANGELOG=$(awk '/^---[[:space:]]*$/ || /^<details>/{ exit } /^## /{ found=1 } found' "$file")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed -E 's/\[(curseforge|modrinth)[^]]*\]//g' | sed '/./,$!d')
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="$MOD_NAME $MOD_VERSION for $LOADER_NAME $MC."

          tag="modrinth-$LOADER-$MC-$MOD_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$LOADER_NAME $MC $MOD_VERSION is already on Modrinth (tag $tag), not uploading it again"
            exit 0
          fi

          jar="dist/$MOD_ID-$LOADER-$MOD_VERSION+mc$MC.jar"
          data=$(jq -nc \
            --arg project "$MODRINTH_PROJECT_ID" \
            --arg name "$MOD_NAME $MOD_VERSION for $LOADER_NAME $MC" \
            --arg number "$MOD_VERSION+mc$MC-$LOADER" \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg mc "$MC" \
            --arg loader "$LOADER" \
            --argjson dependencies "$DEPENDENCIES" \
            '{project_id: $project, name: $name, version_number: $number, changelog: $changelog,
              version_type: $type, game_versions: [$mc], loaders: [$loader],
              dependencies: $dependencies, featured: true, file_parts: ["file"], primary_file: "file"}')

          # Tag first, removed again on failure: see publish-curseforge.
          git tag "$tag"
          git push origin "$tag"

          echo "Uploading $jar to Modrinth as a $RELEASE_TYPE for $LOADER_NAME $MC"
          if ! curl -sS --fail-with-body -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $USER_AGENT" \
            --form-string "data=$data" -F "file=@$jar"; then
            echo
            echo "::error::The upload to Modrinth failed; removing tag $tag so a new run uploads it."
            git push --delete origin "$tag" \
              || echo "::error::Could not delete tag $tag: delete it by hand before running again."
            exit 1
          fi
          echo
