name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # El tag manda, pero gradle.properties es lo que acaba dentro del jar.
      # Si no coinciden, publicarias un v1.6.1 conteniendo un 1.6.0.
      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "tag: $TAG_VERSION | gradle.properties: $MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::El tag ($TAG_VERSION) no coincide con mod_version ($MOD_VERSION). Corrige gradle.properties o borra y rehaz el tag."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UltimateCustomGear ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            build/libs/*.jar
