name: Check docs

on:
  push:
    branches:
      - "NeoFabric/**"
    paths:
      - "docs/**"
      - "tools/CheckDocsParity.java"
  pull_request:
    paths:
      - "docs/**"
      - "tools/CheckDocsParity.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checker is plain Java with no Minecraft on the classpath, so 21 is
      # enough here even on the branches that build with 25.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "21"
          distribution: "temurin"

      # A single source file, uncompiled (JEP 330).
      - name: Check docs parity
        run: java tools/CheckDocsParity.java