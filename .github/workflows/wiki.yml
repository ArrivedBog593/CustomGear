name: Mirror docs to wiki

on:
  push:
    branches:
      - "Neo/1.21.1"
    paths:
      - "docs/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      # The wiki is a separate git repository. The built-in GITHUB_TOKEN can NOT
      # write to it: returns 403 "denied to github-actions[bot]". A classic PAT
      # with scope 'repo' is required, saved as a WIKI_TOKEN secret.
      - name: Checkout wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Build wiki pages from docs/
        env:
          REPO: ${{ github.repository }}
          BRANCH: Neo/1.21.1
        run: |
          set -euo pipefail

          # Clean previous pages, keeping the wiki history.
          find wiki -maxdepth 1 -name '*.md' -delete

          SLUGS=$(ls docs/en/*.md | xargs -n1 basename | sed 's/\.md$//')

          # --- English: docs/en/x.md -> x.md, index.md -> Home.md ---
          for f in docs/en/*.md; do
            name=$(basename "$f" .md)
            [ "$name" = "index" ] && out="Home.md" || out="$name.md"
            cp "$f" "wiki/$out"
          done

          # --- Spanish: docs/es/x.md -> es-x.md, index.md -> es-Home.md ---
          for f in docs/es/*.md; do
            name=$(basename "$f" .md)
            [ "$name" = "index" ] && out="es-Home.md" || out="es-$name.md"
            cp "$f" "wiki/$out"
          done

          cp docs/_Sidebar.md wiki/_Sidebar.md

          # --- Link rewriting ---
          # The wiki references pages by name, without extension.
          for f in wiki/*.md; do
            # x.md -> x  |  x.md#anchor -> x#anchor
            sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md([)#])/](\1\2/g' "$f"

            # The .md files in the root of the repo don't exist in the wiki: absolute link.
            sed -i -E "s#\]\(\.\./\.\./([A-Za-z0-9_.-]+)\)#](https://github.com/${REPO}/blob/${BRANCH}/\1)#g" "$f"

            # index -> Home
            sed -i -E 's/\]\(index([)#])/](Home\1/g' "$f"
          done

          # In the es- pages, internal links point to their es- sisters.
          for f in wiki/es-*.md; do
            for s in $SLUGS; do
              [ "$s" = "index" ] && continue
              sed -i -E "s/\]\($s([)#])/](es-$s\1/g" "$f"
            done
            sed -i -E 's/\]\(Home([)#])/](es-Home\1/g' "$f"
          done

      - name: Push
        run: |
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA::7}"
          git push
