# Keeps the workflow actions and the Gradle wrapper current on their own.
# Without this, action versions silently rot until a runtime deprecation
# breaks a release.
#
# Dependabot reads this file from the default branch only, and without
# target-branch it only updates the default branch. Every branch has its own
# workflows and wrapper, so each needs its own entries here (one per
# ecosystem): add them when a branch is created, remove them when one is
# dropped.
#
# The gradle ecosystem is limited to the wrapper. Left open it would also
# bump the plugins and libraries in the build scripts (Loom, ModDevGradle,
# sponge-mixin), which must match each branch's Minecraft version and
# loaders. The versions in gradle.properties it does not read at all.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "NeoFabric/1.21.1"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "NeoFabric/1.21.1"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    allow:
      - dependency-name: "gradle-wrapper"

