# Slot.x and Slot.y are final in vanilla, so a scrolling container cannot move
# its slots — and AbstractContainerScreen reads these fields directly to draw
# and to hit-test, so a subclass with its own coordinates would not be seen.
# Dropping the final is what every scrolling-inventory mod does, Sophisticated
# Storage included.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
# Mod items need the bow, crossbow and shield animations vanilla registers
# only for its own items.
public net.minecraft.client.renderer.item.ItemProperties register(Lnet/minecraft/world/item/Item;Lnet/minecraft/resources/ResourceLocation;Lnet/minecraft/client/renderer/item/ClampedItemPropertyFunction;)V
# Every container shares one block entity type, built like vanilla's.
public net.minecraft.world.level.block.entity.BlockEntityType$BlockEntitySupplier
