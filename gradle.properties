## Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mod
# Every mod_* key is offered to the metadata templates (src/main/templates in
# each loader) as ${key}; see build-logic/.../multiloader-loader.gradle.
# Lowercase letters, digits and underscores, starting with a letter
# ([a-z][a-z0-9_]{1,63}). Must match Constants.MOD_ID.
mod_id=customgear
mod_name=Custom Gear
# The jar is named <mod_id>-<loader>-<mod_version>+mc<minecraft_version>.jar.
# See https://semver.org/
mod_version=1.0.0
# The Maven group, and the base package of the sources.
mod_group_id=arrivedbog593.customgear
mod_authors=ArrivedBog593
# The mod's license, an SPDX identifier (https://spdx.org/licenses/).
mod_license=MIT
# A literal \n becomes a line break in the mod list. Quotes and backslashes
# are fine too: the build escapes them for fabric.mod.json and
# neoforge.mods.toml.
mod_description=Data-driven custom gear: add armor sets, weapons, tools, food, items, blocks, containers and fluids from simple JSON files. No coding required.
mod_credits=Based on Ultimate Custom Gear (ArrivedBog593 and NadienDev).
mod_homepage_url=https://github.com/ArrivedBog593/CustomGear
mod_sources_url=https://github.com/ArrivedBog593/CustomGear
mod_issues_url=https://github.com/ArrivedBog593/CustomGear/issues

## Minecraft and Java
# This branch builds for one Minecraft version, for every loader in it.
minecraft_version=1.21.1
# The Minecraft versions NeoForge accepts. Snapshots, pre-releases and
# release candidates are not guaranteed to sort properly.
minecraft_version_range=[1.21.1]
# The Java the mod is compiled for (the toolchain in build-logic); the
# workflows read it too. Gradle itself runs on the Java in
# gradle/gradle-daemon-jvm.properties, which can be newer.
java_version=21
# The plain Minecraft that common/ compiles against: no loader API in sight,
# so anything loader-specific there fails to compile instead of failing on
# the other loader at runtime. Must be the NeoForm that neo_version uses.
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# Parameter names for the obfuscated versions (up to 1.21.11); a branch
# without these two keys gets no Parchment at all.
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## NeoForge
# The one the jar is built against and the dev run uses: kept at the newest.
# https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.267
# The NeoForge versions the jar accepts, kept apart from neo_version so
# updating that one never shuts out players on an older NeoForge. 21.1.26 is
# the first 1.21.1 build with MixinExtras 0.4 and Mixin 0.15.2.
neo_version_range=[21.1.26,)
# The FML major versions the jar accepts. On 1.21.1 (FML 4)
# neoforge.mods.toml must name modLoader and loaderVersion, as the MDK
# does; from 1.21.11 on neither is required, so those branches drop both.
loader_version_range=[4,)

## Fabric
# The loader the jar is built against and the dev run uses: kept at the
# newest, or a mod in the run's mods/ folder may need a newer one than the
# dev run has. https://fabricmc.net/develop/
fabric_loader_version=0.20.1
# The loaders the jar accepts (fabric.mod.json). 0.16.0 is the first to
# bundle MixinExtras 0.4. Raise it if Fabric API needs a newer one.
fabric_loader_requirement=>=0.16.0
fabric_api_version=0.116.18+1.21.1

## Mixin
# common/ only needs their annotations, which both loaders bundle at
# runtime, so it compiles against the oldest ones the jar can meet there: a
# feature from a newer version then fails to compile instead of crashing on
# those players. MixinExtras 0.4.0 is bundled by Fabric Loader 0.16.0
# (NeoForge 21.1.26 bundles 0.4.1).
mixin_extras_version=0.4.0
# Fabric's fork of Mixin, which both loaders bundle: 0.15.0 comes with Fabric
# Loader 0.16.0 (NeoForge 21.1.26 bundles 0.15.2).
mixin_version=0.15.0+mixin.0.8.7

## Integrations
# All optional. GeckoLib draws 3D armor, Curios (NeoForge) and Trinkets
# (Fabric) add the slots a backpack can be worn in, JEI shows the recipes.
# The jar accepts these versions and newer (the metadata templates).
geckolib_version=4.9.2
curios_version=9.5.1
trinkets_version=3.10.0
jei_version=19.70.0.460
