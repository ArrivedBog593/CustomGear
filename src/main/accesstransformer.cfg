# Slot.x and Slot.y are final in vanilla, so a scrolling container cannot move
# its slots — and AbstractContainerScreen reads these fields directly to draw
# and to hit-test, so a subclass with its own coordinates would not be seen.
# Dropping the final is what every scrolling-inventory mod does, Sophisticated
# Storage included.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y